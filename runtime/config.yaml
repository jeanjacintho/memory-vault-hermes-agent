# The declarative half of this agent's home -- everything that is a deliberate
# choice for this deployment. Keys equal to the image's own defaults are
# deliberately absent, so the pinned image supplies its current defaults rather
# than a frozen snapshot of them.
#
# _config_version pinned to the CURRENT version (confirmed live via
# /opt/hermes/hermes_cli/config.py and docker logs), not merely a migratable
# one: 37 still triggered the 37->39 migration step on every boot, and that
# step itself unconditionally resets model: to the Plow-hosted default as
# part of upgrading a pre-39 config onto the hosted-routing scheme -- so a
# migratable-but-stale version has the exact same symptom as no version at
# all (model never sticks), just with a different log line
# ("Migrating config schema 37 -> 39" instead of "predates version 12").
# Declaring the file already-current skips that step entirely.
_config_version: 39
# One session per group chat, shared by every participant. Present despite the
# "absent keys mean image defaults" rule above: the image default (true) splits
# a group thread into per-sender sessions, and the plow-chat plugin's
# config.extra flag never reaches the gateway session store.
group_sessions_per_user: false
# Saved-content memory backend: the built-in holographic fact store (SQLite,
# local, no API key -- confirmed reading the plugin source inside the image).
# Not a service we run; the plugin ships with Hermes and activates on this
# key alone. Entity linking is a regex over capitalized phrases and quoted
# terms, which is why mv-ingest quotes every entity in `content`.
memory:
  provider: holographic
mcp_servers:
  # Plow Latch, reached over the Plow relay: the browser and filesystem this
  # agent works on are the operator's Mac, not this container. The relay
  # authorises the connection and tells the Mac who is asking; the Mac
  # authorises each action. Both values come from the agent's own dotenv, so
  # the credential never appears in this file or in a URL in git.
  #
  # THIS BLOCK IS THE DECLARATION. An agent that drives no Mac deletes it --
  # leaving it in place with blank DOMO_* values is a configured latch with no
  # credential, which is a broken agent rather than an unconfigured one.
  #
  # Baseline rather than optional because most agents want it: a new one is
  # wired for Latch and you remove this if it drives nothing.
  latch:
    url: https://api.plow.co/v1/relay/devices/${DOMO_DEVICE_UID}/mcp
    headers:
      Authorization: Bearer ${DOMO_MCP_TOKEN}
    enabled: true
plugins:
  enabled:
  - plow-chat-platform
  entries:
    plow-chat-platform:
      # The plugin registers one platform and no tools. Denying overrides keeps
      # a future plugin change from silently shadowing an image tool of the
      # same name, which would be invisible from this file.
      allow_tool_override: false
  # Saved-content memory backend config (the provider itself is activated by
  # memory.provider above; this only sets its one non-default knob).
  hermes-memory-store:
    db_path: ${HERMES_HOME}/memory_store.db
platforms:
  plow_chat:
    enabled: true
# plow-init writes seed display whole on every boot. Hermes defaults
# plow_chat to interim messages and tool progress on; measured on the
# sibling paper, every Latch step landed in the owner's DM. Skills
# telling the model to stay quiet are not a gate — these keys are.
display:
  tool_progress: off
  interim_assistant_messages: false
  long_running_notifications: false
  busy_ack_detail: false
  live_status: off
  platforms:
    plow_chat:
      tool_progress: off
      interim_assistant_messages: false
      long_running_notifications: false
      busy_ack_detail: false
      live_status: off
# Structural fix, not a prompt one: a smaller model kept reaching for
# web_extract/browser_exec instead of Latch. Freezing platform_toolsets as
# an allowlist also freezes the image's other defaults; disable the three
# fetch toolsets and let the seed keep the rest.
#
# Provider/model are not pinned here or in compose.yml: plow-init writes the
# Plow-hosted default when HERMES_PROVIDER / HERMES_MODEL are unset, which is
# the evaluation contract (same omission as life-assistant / The Plow Times).
agent:
  disabled_toolsets:
    - web
    - search
    - browser
